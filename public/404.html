<!doctype html><html lang="hy"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><meta name="author" content="uInvite"><title>Էջը չի գտնվել — uInvite</title><link rel="icon" href="/favicon.png"><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#fafaf8;color:#222;font:16px/1.8 system-ui}main{text-align:center;padding:30px}h1{font-size:70px;margin:0}h2{font-size:24px}a{display:inline-block;padding:10px 20px;border-radius:10px;background:#111;color:white;text-decoration:none}</style></head><body><main><h1>404</h1><h2>Էջը չի գտնվել</h2><p>Ձեր փնտրած էջը գոյություն չունի կամ տեղափոխվել է։</p><a href="/">Գլխավոր էջ</a></main><script>
try {
  const language = localStorage.getItem('uinvite-language');
  const copy = {
    ru: ['Страница не найдена', 'Страница, которую вы ищете, не существует или была перемещена.', 'На главную'],
    en: ['Page not found', 'The page you are looking for does not exist or has moved.', 'Go home']
  }[language];
  if (copy) {
    document.documentElement.lang = language;
    document.title = copy[0] + ' — uInvite';
    document.querySelector('h2').textContent = copy[0];
    document.querySelector('p').textContent = copy[1];
    document.querySelector('a').textContent = copy[2];
  }
} catch {}
</script></body></html>
