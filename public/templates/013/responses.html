<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RSVP Պատասխաններ — Շաբլոն 013</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400;1,500&family=Nunito+Sans:wght@300;400;500;600&display=swap"
        rel="stylesheet">
    <style>
        /* =============================================
           CSS Variables — matching template 013 theme
           ============================================= */
        :root {
            --background: hsl(40, 33%, 98%);
            --foreground: hsl(30, 10%, 25%);
            --card: hsl(40, 40%, 97%);
            --primary: hsl(38, 60%, 50%);
            --primary-foreground: hsl(40, 33%, 98%);
            --secondary: hsl(35, 30%, 92%);
            --muted: hsl(35, 20%, 94%);
            --muted-foreground: hsl(30, 8%, 50%);
            --border: hsl(35, 25%, 88%);
            --gold: hsl(38, 60%, 50%);
            --gold-light: hsl(40, 50%, 75%);
            --gold-dark: hsl(38, 50%, 40%);
            --font-heading: 'Cormorant Garamond', serif;
            --font-body: 'Nunito Sans', sans-serif;
            --green: hsl(142, 40%, 45%);
            --red: hsl(0, 50%, 55%);
        }

        /* Reset */
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: var(--font-body);
            background-color: var(--background);
            color: var(--foreground);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }

        h1,
        h2,
        h3 {
            font-family: var(--font-heading);
        }

        /* =============================================
           Hero Header
           ============================================= */
        .responses-hero {
            background: linear-gradient(135deg,
                    hsla(38, 60%, 50%, 0.15),
                    hsla(35, 30%, 92%, 0.5),
                    hsla(38, 60%, 50%, 0.1));
            padding: 60px 20px 50px;
            text-align: center;
            border-bottom: 1px solid hsla(38, 60%, 50%, 0.15);
            position: relative;
            overflow: hidden;
        }

        .responses-hero::before {
            content: '☩';
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 28px;
            color: var(--gold);
            opacity: 0.6;
        }

        .responses-hero-title {
            font-size: clamp(2rem, 5vw, 3rem);
            font-weight: 300;
            letter-spacing: 0.05em;
            margin-bottom: 8px;
            background: linear-gradient(135deg, var(--gold-dark), var(--gold), var(--gold-light));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .responses-hero-subtitle {
            font-size: 16px;
            color: var(--muted-foreground);
            margin-bottom: 24px;
        }

        /* Stats Cards */
        .stats-row {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .stat-card {
            background: hsla(40, 40%, 97%, 0.9);
            border: 1px solid hsla(38, 60%, 50%, 0.15);
            border-radius: 12px;
            padding: 16px 28px;
            text-align: center;
            min-width: 120px;
            backdrop-filter: blur(8px);
        }

        .stat-number {
            font-family: var(--font-heading);
            font-size: 32px;
            font-weight: 600;
            line-height: 1;
        }

        .stat-number.total {
            color: var(--gold);
        }

        .stat-number.yes {
            color: var(--green);
        }

        .stat-number.no {
            color: var(--red);
        }

        .stat-label {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            color: var(--muted-foreground);
            margin-top: 6px;
        }

        /* =============================================
           Content
           ============================================= */
        .responses-content {
            max-width: 800px;
            margin: 0 auto;
            padding: 40px 20px 80px;
        }

        /* Section Divider */
        .section-divider {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 32px;
        }

        .section-divider-line {
            height: 1px;
            width: 80px;
        }

        .section-divider-line.left {
            background: linear-gradient(to right, transparent, hsla(38, 60%, 50%, 0.5));
        }

        .section-divider-line.right {
            background: linear-gradient(to left, transparent, hsla(38, 60%, 50%, 0.5));
        }

        .section-divider-diamond {
            width: 10px;
            height: 10px;
            transform: rotate(45deg);
            border: 1px solid hsla(38, 60%, 50%, 0.5);
        }

        /* =============================================
           Loading / Error / Empty States
           ============================================= */
        .state-container {
            text-align: center;
            padding: 60px 20px;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid hsla(38, 60%, 50%, 0.15);
            border-top-color: var(--gold);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 16px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .state-icon {
            font-size: 48px;
            margin-bottom: 16px;
        }

        .state-text {
            font-size: 16px;
            color: var(--muted-foreground);
        }

        .state-text.error {
            color: var(--red);
        }

        .retry-btn {
            margin-top: 20px;
            padding: 10px 28px;
            background: linear-gradient(135deg, var(--gold), var(--gold-dark));
            color: var(--primary-foreground);
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            font-family: var(--font-body);
            transition: all 0.3s;
        }

        .retry-btn:hover {
            box-shadow: 0 4px 16px hsla(38, 60%, 50%, 0.3);
            transform: translateY(-1px);
        }

        /* =============================================
           Response Cards
           ============================================= */
        .responses-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .response-card {
            position: relative;
            background: var(--card);
            border: 1px solid hsla(38, 60%, 50%, 0.1);
            border-radius: 16px;
            padding: 24px;
            transition: all 0.4s ease;
            overflow: hidden;
        }

        .response-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 4px;
            height: 100%;
            border-radius: 16px 0 0 16px;
        }

        .response-card.attending::before {
            background: linear-gradient(to bottom, var(--green), hsla(142, 40%, 45%, 0.3));
        }

        .response-card.not-attending::before {
            background: linear-gradient(to bottom, var(--red), hsla(0, 50%, 55%, 0.3));
        }

        .response-card:hover {
            box-shadow: 0 8px 24px hsla(38, 60%, 50%, 0.08);
            transform: translateY(-2px);
        }

        /* Card corner decoration */
        .response-card-corner {
            position: absolute;
            top: 0;
            right: 0;
            width: 2.5rem;
            height: 2.5rem;
            overflow: hidden;
        }

        .response-card-corner::after {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            width: 1.25rem;
            height: 1.25rem;
            border-top: 1px solid hsla(38, 60%, 50%, 0.2);
            border-right: 1px solid hsla(38, 60%, 50%, 0.2);
            border-top-right-radius: 16px;
        }

        .response-card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 12px;
        }

        .response-card-name {
            font-family: var(--font-heading);
            font-size: 22px;
            font-weight: 500;
        }

        .response-card-date {
            font-size: 13px;
            color: var(--muted-foreground);
            white-space: nowrap;
            margin-left: 16px;
        }

        .response-card-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 0.03em;
        }

        .response-card-badge.yes {
            background: hsla(142, 40%, 45%, 0.1);
            color: var(--green);
            border: 1px solid hsla(142, 40%, 45%, 0.2);
        }

        .response-card-badge.no {
            background: hsla(0, 50%, 55%, 0.08);
            color: var(--red);
            border: 1px solid hsla(0, 50%, 55%, 0.15);
        }

        .response-card-message {
            margin-top: 12px;
            padding: 14px 18px;
            background: hsla(35, 30%, 92%, 0.5);
            border-radius: 10px;
            border-left: 3px solid hsla(38, 60%, 50%, 0.3);
            font-size: 15px;
            color: var(--foreground);
            line-height: 1.6;
            font-style: italic;
        }

        /* =============================================
           Footer
           ============================================= */
        .responses-footer {
            text-align: center;
            padding: 40px 20px;
            border-top: 1px solid var(--border);
        }

        .footer-ornament {
            color: var(--gold);
            font-size: 18px;
            letter-spacing: 0.5em;
            margin-bottom: 12px;
        }

        .footer-text {
            font-size: 14px;
            color: var(--muted-foreground);
        }

        .footer-link {
            display: inline-block;
            margin-top: 12px;
            color: var(--gold);
            text-decoration: none;
            font-weight: 500;
            transition: opacity 0.2s;
        }

        .footer-link:hover {
            opacity: 0.7;
        }

        /* =============================================
           Responsive
           ============================================= */
        @media (max-width: 768px) {
            .responses-hero {
                padding: 50px 16px 40px;
            }

            .responses-content {
                padding: 24px 16px 60px;
            }

            .response-card {
                padding: 18px;
            }

            .response-card-header {
                flex-direction: column;
                gap: 8px;
            }

            .response-card-date {
                margin-left: 0;
            }

            .response-card-name {
                font-size: 19px;
            }

            .stat-card {
                padding: 12px 20px;
                min-width: 90px;
            }

            .stat-number {
                font-size: 26px;
            }
        }

        /* =============================================
           Animation
           ============================================= */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .fade-in-up {
            animation: fadeInUp 0.5s ease-out forwards;
            opacity: 0;
        }
    </style>
</head>

<body>
    <div id="responses-wrapper">
        <!-- Hero -->
        <header class="responses-hero">
            <h1 class="responses-hero-title">RSVP Պատասխաններ</h1>
            <p class="responses-hero-subtitle">Մկրտության Հրավեր — Շաբլոն 013</p>
            <div class="stats-row" id="stats-row" style="display: none;"></div>
        </header>

        <!-- Content -->
        <main class="responses-content">
            <!-- Divider -->
            <div class="section-divider">
                <div class="section-divider-line left"></div>
                <div class="section-divider-diamond"></div>
                <div class="section-divider-line right"></div>
            </div>

            <!-- Dynamic content -->
            <div id="content"></div>
        </main>

        <!-- Footer -->
        <footer class="responses-footer">
            <div class="footer-ornament">✦ ✦ ✦</div>
            <p class="footer-text">Մկրտության Հրավեր — Շաբլոն 013</p>
            <a href="index.html" class="footer-link">← Հետ դեպի հրավեր</a>
        </footer>
    </div>

    <script src="config.js"></script>
    <script>
        // =============================================
        // Configuration
        // =============================================
        const API_URL = API_BASE_URL + '/api/rsvp?template_code=013';

        // =============================================
        // Main
        // =============================================
        document.addEventListener('DOMContentLoaded', fetchResponses);

        async function fetchResponses() {
            const contentEl = document.getElementById('content');
            const statsEl = document.getElementById('stats-row');

            // Show loading
            contentEl.innerHTML = `
                <div class="state-container">
                    <div class="spinner"></div>
                    <p class="state-text">Պատասխանները բեռնվում են...</p>
                </div>
            `;

            try {
                const res = await fetch(API_URL);
                const json = await res.json();

                if (!json.success) {
                    showError(contentEl);
                    return;
                }

                // Show stats
                statsEl.style.display = 'flex';
                statsEl.innerHTML = `
                    <div class="stat-card">
                        <div class="stat-number total">${json.total}</div>
                        <div class="stat-label">Ընդհանուր</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-number yes">${json.total_yes}</div>
                        <div class="stat-label">Կմասնակցեն</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-number no">${json.total_no}</div>
                        <div class="stat-label">Չեն մասնակցի</div>
                    </div>
                `;

                // Show responses
                if (json.data.length === 0) {
                    contentEl.innerHTML = `
                        <div class="state-container">
                            <div class="state-icon">📭</div>
                            <p class="state-text">Դեռ պատասխաններ չկան</p>
                        </div>
                    `;
                    return;
                }

                contentEl.innerHTML = '<div class="responses-list">' +
                    json.data.map((item, i) => renderCard(item, i)).join('') +
                    '</div>';

            } catch (err) {
                showError(contentEl);
            }
        }

        function renderCard(item, index) {
            const data = item.data || {};
            const isYes = data.attendance === 'yes';
            const badgeClass = isYes ? 'yes' : 'no';
            const cardClass = isYes ? 'attending' : 'not-attending';
            const badgeText = isYes ? '✓ Կմասնակցեն' : '✗ Չեն մասնակցի';
            const date = formatDate(item.created_at);

            let messageHtml = '';
            if (data.message) {
                messageHtml = `<div class="response-card-message">"${escapeHtml(data.message)}"</div>`;
            }

            return `
                <div class="response-card ${cardClass} fade-in-up" style="animation-delay: ${index * 0.08}s">
                    <div class="response-card-corner"></div>
                    <div class="response-card-header">
                        <h3 class="response-card-name">${escapeHtml(item.name)}</h3>
                        <span class="response-card-date">${date}</span>
                    </div>
                    <span class="response-card-badge ${badgeClass}">${badgeText}</span>
                    ${messageHtml}
                </div>
            `;
        }

        function showError(el) {
            el.innerHTML = `
                <div class="state-container">
                    <div class="state-icon">⚠️</div>
                    <p class="state-text error">Չհաջողվեց բեռնել պատասխանները</p>
                    <button class="retry-btn" onclick="fetchResponses()">Կրկնել</button>
                </div>
            `;
        }

        function formatDate(dateStr) {
            const d = new Date(dateStr);
            return d.toLocaleDateString('en-US', {
                day: '2-digit',
                month: 'short',
                year: 'numeric',
            });
        }

        // ========================
        // Height Reporting for Iframe
        // ========================
        let lastHeight = 0;
        function reportHeight() {
            const wrapper = document.getElementById('responses-wrapper');
            if (!wrapper) return;
            const height = Math.ceil(wrapper.offsetHeight);
            if (Math.abs(height - lastHeight) > 2) {
                window.parent.postMessage({ type: 'SET_HEIGHT', height: height }, '*');
                lastHeight = height;
            }
        }

        // Initial report
        reportHeight();

        // Re-report on window resize
        window.addEventListener('resize', reportHeight);

        // Also report height after all images are loaded
        window.addEventListener('load', reportHeight);

        // Periodic check for dynamic content changes
        setInterval(reportHeight, 1000);

        // Watch for content changes (e.g. dynamic forms, reveal animations)
        const heightObserver = new MutationObserver(reportHeight);
        heightObserver.observe(document.body, { attributes: true, childList: true, subtree: true });

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }
    </script>
</body>

</html>
